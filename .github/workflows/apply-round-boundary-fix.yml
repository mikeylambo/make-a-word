name: Apply round-boundary source patch

on:
  push:
    branches: [fix/round-boundaries]
    paths: [.github/workflows/apply-round-boundary-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/round-boundaries
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch round boundary behavior
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/main.ts';
          let source = fs.readFileSync(path, 'utf8');
          const replace = (from, to, label) => {
            if (!source.includes(from)) throw new Error(`Missing patch anchor: ${label}`);
            source = source.replace(from, to);
          };

          replace(
            'import {\n  burnLetters,',
            'import {\n  burnBoardSettlement,\n  burnLetters,',
            'Burn settlement import'
          );

          replace(
            '  journeyStage?: number;\n  challengeTarget?: number;\n  starting: boolean;',
            '  journeyStage?: number;\n  challengeTarget?: number;\n  dailyKey?: string;\n  starting: boolean;',
            'Daily round key state'
          );

          replace(
            'function todayKey(): string {\n  return new Date().toISOString().slice(0, 10);\n}',
            'function todayKey(date = new Date()): string {\n  return date.toISOString().slice(0, 10);\n}',
            'Date-aware Daily key'
          );

          replace(
            '  const token = ++flowToken;\n  const phrase = phraseOverride ?? choosePhrase(mode);',
            '  const token = ++flowToken;\n  const dailyDate = mode === "daily" ? new Date() : undefined;\n  const phrase = phraseOverride ?? (dailyDate ? phraseForDay(dailyDate) : choosePhrase(mode));',
            'Daily phrase selection instant'
          );

          replace(
            '    journeyStage,\n    challengeTarget,\n    starting: true,',
            '    journeyStage,\n    challengeTarget,\n    dailyKey: dailyDate ? todayKey(dailyDate) : undefined,\n    starting: true,',
            'Persist Daily round key'
          );

          replace(
            '  const boardClear = remaining === 0;\n  const bonus = 250 + (total - remaining) * 35 - remaining * 60 + (boardClear ? 1000 : 0);',
            '  const { boardClear, scoreDelta: bonus } = burnBoardSettlement(total, remaining);',
            'Shared Burn board settlement'
          );

          replace(
            'function endRound(): void {\n  if (!round || round.ended) return;\n  cashChain(false);\n  round.ended = true;',
            'function endRound(): void {\n  if (!round || round.ended) return;\n  cashChain(false);\n  if (round.mode === "burn") {\n    const remaining = [...remainingCounts(round.phrase.text, round.burned).values()].reduce((sum, count) => sum + count, 0);\n    const total = [...countsForText(round.phrase.text).values()].reduce((sum, count) => sum + count, 0);\n    const { boardClear, scoreDelta } = burnBoardSettlement(total, remaining);\n    round.score = Math.max(0, round.score + scoreDelta);\n    if (boardClear) round.boardsCleared += 1;\n  }\n  round.ended = true;',
            'Final Burn board settlement'
          );

          replace(
            '  if (round.mode === "daily") save.daily[todayKey()] = Math.max(save.daily[todayKey()] ?? 0, round.score);',
            '  if (round.mode === "daily") {\n    const key = round.dailyKey ?? todayKey();\n    save.daily[key] = Math.max(save.daily[key] ?? 0, round.score);\n  }',
            'Daily score pinned to round start day'
          );

          fs.writeFileSync(path, source);
          NODE
      - name: Compile patched source
        run: |
          npm ci
          npm run build
      - name: Commit source patch
        run: |
          rm .github/workflows/apply-round-boundary-fix.yml
          git config user.name "Make a Word CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/main.ts .github/workflows/apply-round-boundary-fix.yml
          git commit -m "Settle final Burn boards and pin Daily rounds"
          git push origin HEAD:fix/round-boundaries
