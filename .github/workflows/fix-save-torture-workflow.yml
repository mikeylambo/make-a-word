name: Fix save torture staging

on:
  push:
    branches: [fix/save-reload-torture]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/save-reload-torture
          fetch-depth: 0
      - name: Correct burned-index sanitizer and assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-save-reload-torture.yml')
          text = path.read_text()
          old = '? [...new Set(input.burned.map((entry) => safeInt(entry, 0, 512, -1)).filter((entry) => entry >= 0))].slice(0, 512)'
          new = '? [...new Set(input.burned.filter((entry): entry is number => typeof entry === "number" && Number.isInteger(entry) && entry >= 0 && entry <= 512))].slice(0, 512)'
          if old in text:
              text = text.replace(old, new, 1)
          text = text.replace("assert.deepEqual(sanitized.burned, [3, 512]);", "assert.deepEqual(sanitized.burned, [3]);", 1)
          path.write_text(text)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "Make a Word CI"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/apply-save-reload-torture.yml
          git commit -m "Reject invalid burned indices in run snapshots"
          git push origin HEAD:fix/save-reload-torture
