name: Apply Daily and stats semantics patch

on:
  push:
    branches: [fix/stats-daily-semantics]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stats-daily-semantics
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch Daily and stats semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path('src/main.ts')
          main = main_path.read_text()
          replacements = [
            (
              'const played = new Set(Object.keys(save.daily).filter((key) => (save.daily[key] ?? 0) > 0));',
              'const played = new Set(Object.keys(save.daily));',
              'Daily streak completion semantics'
            ),
            (
              '  const dailyDone = save.daily[todayKey()] ?? 0;\n  const streak = dailyStreak();',
              '  const dailyKey = todayKey();\n  const dailyPlayed = Object.prototype.hasOwnProperty.call(save.daily, dailyKey);\n  const dailyDone = save.daily[dailyKey] ?? 0;\n  const streak = dailyStreak();',
              'Daily menu completion state'
            ),
            (
              '${dailyDone ? `BEST ${dailyDone.toLocaleString()}` : "A NEW PUZZLE EVERY DAY"}<br>${streak} DAY STREAK',
              '${dailyPlayed ? `BEST ${dailyDone.toLocaleString()}` : "A NEW PUZZLE EVERY DAY"}<br>${streak} DAY STREAK',
              'Daily zero-score presentation'
            )
          ]
          for old, new, label in replacements:
            if main.count(old) != 1:
              raise SystemExit(f'{label}: expected 1 match, found {main.count(old)}')
            main = main.replace(old, new, 1)
          main_path.write_text(main)

          online_path = Path('src/online-client.ts')
          online = online_path.read_text()
          old = '  save.roundsPlayed += 1;'
          new = '  // Lifetime score stores the whole match, so round count must advance by\n  // the actual number of timed rounds to keep average-score semantics coherent.\n  save.roundsPlayed += response.room.settings.rounds;'
          if online.count(old) != 1:
            raise SystemExit(f'online round count: expected 1 match, found {online.count(old)}')
          online_path.write_text(online.replace(old, new, 1))

          progression_path = Path('scripts/verify-progression.mjs')
          progression = progression_path.read_text()
          marker = "need(main, 'function todayKey(date = new Date()): string', 'Daily keys cannot be derived from the exact round-start instant');"
          insert = "need(main, 'const played = new Set(Object.keys(save.daily));', 'zero-score Daily completions do not count toward streaks');\nneed(main, 'const dailyPlayed = Object.prototype.hasOwnProperty.call(save.daily, dailyKey);', 'Daily menu cannot distinguish an unplayed day from a completed zero-score day');\n" + marker
          if progression.count(marker) != 1:
            raise SystemExit('progression Daily marker missing')
          progression_path.write_text(progression.replace(marker, insert, 1))

          flow_path = Path('scripts/verify-game-flow.mjs')
          flow = flow_path.read_text()
          marker = "need(online, 'save.totalScore += self.score', 'online score is not counted in lifetime progression');"
          insert = marker + "\nneed(online, 'save.roundsPlayed += response.room.settings.rounds', 'online lifetime rounds do not match the number of completed timed rounds');"
          if flow.count(marker) != 1:
            raise SystemExit('game-flow online score marker missing')
          flow_path.write_text(flow.replace(marker, insert, 1))
          PY
      - name: Compile patched source
        run: |
          npm ci
          npm run build
      - name: Commit source patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Make a Word CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/main.ts src/online-client.ts scripts/verify-progression.mjs scripts/verify-game-flow.mjs
          git commit -m "Align Daily completion and lifetime round stats"
          git push origin HEAD:fix/stats-daily-semantics
