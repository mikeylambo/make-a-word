name: Make room API executable in torture tests

on:
  push:
    branches: [fix/online-failure-torture]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/online-failure-torture
      - name: Expand RoomError parameter properties
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('api/room.ts')
          source = path.read_text()
          old = '''class RoomError extends Error {
  constructor(message: string, readonly status = 400, readonly code?: string) {
    super(message);
  }
}'''
          new = '''class RoomError extends Error {
  readonly status: number;
  readonly code?: string;

  constructor(message: string, status = 400, code?: string) {
    super(message);
    this.status = status;
    this.code = code;
  }
}'''
          if old not in source:
            raise SystemExit(0)
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Make a Word CI"
          git config user.email "actions@users.noreply.github.com"
          git add api/room.ts
          git commit -m "Make room API executable in torture tests"
          git push origin HEAD:fix/online-failure-torture
