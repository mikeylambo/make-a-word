name: Apply automated online failure torture pass

on:
  push:
    branches: [fix/online-failure-torture]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/online-failure-torture
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch online failure handling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return source.replace(old, new, 1)

          room_path = Path('api/room.ts')
          room = room_path.read_text()
          room = replace_once(room, 'const ROOM_TTL_SECONDS = 6 * 60 * 60;\nconst PRESENCE_WINDOW_MS = 20_000;', 'const ROOM_TTL_SECONDS = 6 * 60 * 60;\nconst ROOM_TTL_MS = ROOM_TTL_SECONDS * 1_000;\nconst PRESENCE_WINDOW_MS = 20_000;', 'absolute room TTL constant')
          room = replace_once(room, 'let redisClient: Redis | null = null;\n\nclass RoomError', 'let redisClient: Redis | null = null;\n\nexport function __setRedisClientForTests(client: Redis | null): void {\n  redisClient = client;\n}\n\nclass RoomError', 'redis test injection')
          room = replace_once(room, 'function roomKey(code: string): string {\n  return `make-a-word:room:${code}`;\n}\n\nfunction cleanCode', 'function roomKey(code: string): string {\n  return `make-a-word:room:${code}`;\n}\n\nfunction roomTtlSeconds(room: StoredRoom): number {\n  return Math.max(0, Math.ceil((room.createdAt + ROOM_TTL_MS - Date.now()) / 1_000));\n}\n\nfunction roomExpiredError(): RoomError {\n  return new RoomError("That room has expired. Create a new room.", 404, "ROOM_EXPIRED");\n}\n\nfunction cleanCode', 'room TTL helpers')
          room = replace_once(room, 'for (let attempt = 0; attempt < 10; attempt += 1) {', 'for (let attempt = 0; attempt < 16; attempt += 1) {', 'lock contention retries')
          room = replace_once(room, '    const room = await redis.get<StoredRoom>(roomKey(normalizedCode));\n    if (!room) throw new RoomError("That room could not be found. Check the code and try again.", 404, "ROOM_NOT_FOUND");\n    advanceExpiredRound(room);', '    const room = await redis.get<StoredRoom>(roomKey(normalizedCode));\n    if (!room) throw new RoomError("That room could not be found. Check the code and try again.", 404, "ROOM_NOT_FOUND");\n    let ttl = roomTtlSeconds(room);\n    if (ttl <= 0) {\n      await redis.del(roomKey(normalizedCode));\n      throw roomExpiredError();\n    }\n    advanceExpiredRound(room);', 'mutation expiry check')
          room = replace_once(room, '    room.version += 1;\n    await redis.set(roomKey(normalizedCode), room, { ex: ROOM_TTL_SECONDS });', '    room.version += 1;\n    ttl = roomTtlSeconds(room);\n    if (ttl <= 0) {\n      await redis.del(roomKey(normalizedCode));\n      throw roomExpiredError();\n    }\n    await redis.set(roomKey(normalizedCode), room, { ex: ttl });', 'absolute TTL preservation')
          room = replace_once(room, '    if (action.action === "rematch") {\n      requireHost(room, credentials);\n      if (room.phase !== "match-results") throw new RoomError("The rematch is not ready yet.", 409);\n      room.phase = "lobby";', '    if (action.action === "rematch") {\n      requireHost(room, credentials);\n      if (room.phase !== "match-results") throw new RoomError("The rematch is not ready yet.", 409);\n      const now = Date.now();\n      room.players = room.players.filter((entry) => entry.id === room.hostPlayerId || now - entry.lastSeen < HOST_FAILOVER_MS);\n      room.phase = "lobby";', 'rematch stale-player pruning')
          room = replace_once(room, '      } else {\n        player.lastSeen = 0;\n      }\n    }', '      } else {\n        player.lastSeen = 0;\n        if (player.id === room.hostPlayerId) ensureActiveHost(room);\n      }\n    }', 'immediate host transfer on leave')
          room = replace_once(room, '      let room = await redis.get<StoredRoom>(roomKey(credentials.code));\n      if (!room) throw new RoomError("That room could not be found. Check the code and try again.", 404, "ROOM_NOT_FOUND");\n      requirePlayer(room, credentials);', '      let room = await redis.get<StoredRoom>(roomKey(credentials.code));\n      if (!room) throw new RoomError("That room could not be found. Check the code and try again.", 404, "ROOM_NOT_FOUND");\n      if (roomTtlSeconds(room) <= 0) {\n        await redis.del(roomKey(credentials.code));\n        throw roomExpiredError();\n      }\n      requirePlayer(room, credentials);', 'GET expiry check')
          room_path.write_text(room)

          main_path = Path('src/main.ts')
          main = main_path.read_text()
          main = replace_once(main, 'function setOnlineMessage(message: string, bad = true): void {\n  onlineError = message;', 'function onlineFailureEndsSession(code?: string): boolean {\n  return code === "SESSION_EXPIRED" || code === "ROOM_NOT_FOUND" || code === "ROOM_EXPIRED";\n}\n\nfunction setOnlineMessage(message: string, bad = true): void {\n  onlineError = message;', 'permanent online failure helper')
          main = replace_once(main, '  const response = await fetchOnlineRoom(credentials);\n  if (!response.ok) {\n    clearOnlineCredentials();\n    onlineCredentials = null;\n    showOnlineHome(code);\n    setOnlineMessage(response.error);\n    return;\n  }\n  enterOnlineRoom(response.room, credentials);', '  const response = await fetchOnlineRoom(credentials);\n  if (!response.ok) {\n    if (onlineFailureEndsSession(response.code)) {\n      clearOnlineCredentials();\n      onlineCredentials = null;\n      showOnlineHome(code);\n      setOnlineMessage(response.error);\n      return;\n    }\n    onlineError = response.error;\n    const status = document.querySelector<HTMLElement>(".online-connecting p");\n    if (status) status.textContent = "Connection interrupted. Reconnecting…";\n    startOnlineSync();\n    return;\n  }\n  enterOnlineRoom(response.room, credentials);', 'transient reload recovery')
          main = replace_once(main, '  if (!response.ok) {\n    const signal = document.querySelector<HTMLElement>("#online-signal");\n    if (signal) {\n      signal.textContent = "RECONNECTING";\n      signal.classList.add("offline");\n    }\n    if (response.code === "SESSION_EXPIRED" || response.code === "ROOM_NOT_FOUND") setOnlineMessage(response.error);\n    return;\n  }', '  if (!response.ok) {\n    if (onlineFailureEndsSession(response.code)) {\n      const code = onlineCredentials.code;\n      stopOnlineSync();\n      clearOnlineCredentials();\n      onlineCredentials = null;\n      onlineRoom = null;\n      showOnlineHome(code);\n      setOnlineMessage(response.error);\n      return;\n    }\n    const signal = document.querySelector<HTMLElement>("#online-signal");\n    if (signal) {\n      signal.textContent = "RECONNECTING";\n      signal.classList.add("offline");\n    }\n    return;\n  }', 'permanent sync failure cleanup')
          main_path.write_text(main)

          hardening_path = Path('scripts/verify-online-hardening.mjs')
          hardening = hardening_path.read_text()
          hardening = hardening.replace("need(room, 'for (let attempt = 0; attempt < 10; attempt += 1)', 'lock acquisition does not retry through short contention');", "need(room, 'for (let attempt = 0; attempt < 16; attempt += 1)', 'lock acquisition does not retry through burst submission contention');")
          marker = "need(room, 'const MAX_REQUEST_BYTES = 8_192;', 'room request body limit is missing');"
          hardening = replace_once(hardening, marker, marker + "\nneed(room, 'const ROOM_TTL_MS = ROOM_TTL_SECONDS * 1_000;', 'room lifetime is not modeled as an absolute six-hour window');\nneed(room, 'function roomTtlSeconds(room: StoredRoom): number', 'absolute room expiry helper is missing');\nneed(room, 'await redis.set(roomKey(normalizedCode), room, { ex: ttl });', 'heartbeats can still extend rooms beyond the six-hour lifetime');\nneed(room, 'if (player.id === room.hostPlayerId) ensureActiveHost(room);', 'intentional host leave does not transfer control immediately');\nneed(room, 'room.players = room.players.filter((entry) => entry.id === room.hostPlayerId || now - entry.lastSeen < HOST_FAILOVER_MS);', 'rematches retain stale disconnected players');", 'server torture invariants')
          marker = "if (!Number.isFinite(lockTtl) || lockTtl < 5_000) failures.push('room lock TTL must tolerate at least five seconds of backend latency');"
          hardening = replace_once(hardening, marker, marker + "\n\nconst main = fs.readFileSync(new URL('../src/main.ts', import.meta.url), 'utf8');\nneed(main, 'function onlineFailureEndsSession(code?: string): boolean', 'client does not classify permanent versus transient room failures');\nneed(main, 'status.textContent = \"Connection interrupted. Reconnecting…\"', 'reload during a transient outage abandons the room instead of retrying');\nneed(main, 'code === \"ROOM_EXPIRED\"', 'client does not terminate an absolutely expired room session');", 'client reconnect gate')
          hardening_path.write_text(hardening)

          package_path = Path('package.json')
          package = package_path.read_text()
          package = replace_once(package, '"online:verify": "node scripts/verify-online-hardening.mjs",', '"online:verify": "node scripts/verify-online-hardening.mjs && node scripts/verify-online-torture.mjs",', 'online executable torture script')
          package_path.write_text(package)
          PY
      - name: Add executable online torture suite
        run: |
          cat > scripts/verify-online-torture.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { canSpell, countsForText } from '../src/word-rules.ts';
          import handler, { __setRedisClientForTests } from '../api/room.ts';

          const dictionary = JSON.parse(fs.readFileSync(new URL('../content/server-dictionary.json', import.meta.url), 'utf8'));
          const originalNow = Date.now;
          let now = 1_800_000_000_000;
          Date.now = () => now;
          const clone = (value) => value === undefined ? undefined : structuredClone(value);

          class FakeRedis {
            constructor() { this.data = new Map(); }
            clean(key) { const entry = this.data.get(key); if (entry?.expiresAt !== undefined && entry.expiresAt <= Date.now()) this.data.delete(key); }
            async get(key) { this.clean(key); return clone(this.data.get(key)?.value ?? null); }
            async set(key, value, options = {}) { this.clean(key); if (options.nx && this.data.has(key)) return null; let expiresAt; if (options.ex !== undefined) expiresAt = Date.now() + Number(options.ex) * 1_000; if (options.px !== undefined) expiresAt = Date.now() + Number(options.px); this.data.set(key, { value: clone(value), expiresAt }); return 'OK'; }
            async del(key) { return this.data.delete(key) ? 1 : 0; }
            async incr(key) { this.clean(key); const value = Number(this.data.get(key)?.value ?? 0) + 1; const expiresAt = this.data.get(key)?.expiresAt; this.data.set(key, { value, expiresAt }); return value; }
            async expire(key, seconds) { this.clean(key); const entry = this.data.get(key); if (!entry) return 0; entry.expiresAt = Date.now() + Number(seconds) * 1_000; return 1; }
            async eval(_script, keys, args) { const key = keys[0]; this.clean(key); const entry = this.data.get(key); if (entry?.value === args[0]) { this.data.delete(key); return 1; } return 0; }
            peek(key) { this.clean(key); return clone(this.data.get(key)?.value); }
            expiresAt(key) { this.clean(key); return this.data.get(key)?.expiresAt; }
          }

          const redis = new FakeRedis();
          __setRedisClientForTests(redis);

          async function call(method, { body, query = {}, headers = {} } = {}) {
            let statusCode = 200; let payload;
            const req = { method, query, body, headers: { 'x-forwarded-for': '203.0.113.9', ...headers } };
            const res = { setHeader() {}, status(code) { statusCode = code; return this; }, json(value) { payload = value; } };
            await handler(req, res);
            return { status: statusCode, body: payload };
          }
          const post = (body) => call('POST', { body });
          const get = (credentials) => call('GET', { query: { code: credentials.code }, headers: { authorization: `Bearer ${credentials.token}`, 'x-room-player': credentials.playerId } });

          try {
            const created = await post({ action: 'create', name: 'Host', settings: { rounds: 1, roundSeconds: 60, maxPlayers: 8 } });
            assert.equal(created.body.ok, true);
            const host = created.body.credentials;
            const credentials = [host];
            for (let index = 1; index < 8; index += 1) {
              const joined = await post({ action: 'join', code: host.code, name: `Guest ${index}` });
              assert.equal(joined.body.ok, true);
              credentials.push(joined.body.credentials);
            }
            for (const guest of credentials.slice(1)) assert.equal((await post({ action: 'ready', credentials: guest, ready: true })).body.ok, true);
            const started = await post({ action: 'start', credentials: host });
            assert.equal(started.body.room.phase, 'playing');
            const matchId = started.body.room.matchId;
            now = started.body.room.startsAt + 1_000;
            const available = countsForText(started.body.room.phrase.text);
            const playable = dictionary.filter((word) => word.length >= 3 && canSpell(word, available));
            assert.ok(playable.length >= 12);

            const simultaneous = await Promise.all(credentials.map((identity, index) => post({ action: 'submit', credentials: identity, word: playable[index] })));
            assert.equal(simultaneous.filter((result) => result.body.ok).length, 8, 'eight simultaneous submits should survive lock contention');
            const duplicateWord = playable[8];
            const duplicateRace = await Promise.all([post({ action: 'submit', credentials: host, word: duplicateWord }), post({ action: 'submit', credentials: host, word: duplicateWord })]);
            assert.equal(duplicateRace.filter((result) => result.body.ok).length, 1);
            assert.equal(duplicateRace.filter((result) => !result.body.ok && result.body.code === 'DUPLICATE').length, 1);

            const hostLeave = await post({ action: 'leave', credentials: host });
            const promoted = hostLeave.body.room.players.find((player) => player.isHost);
            assert.ok(promoted && promoted.id !== host.playerId, 'host leave should promote immediately');
            const promotedCredentials = credentials.find((identity) => identity.playerId === promoted.id);
            now = hostLeave.body.room.endsAt - 1_000;
            assert.equal((await post({ action: 'heartbeat', credentials: promotedCredentials })).body.ok, true);
            now = hostLeave.body.room.endsAt + 1;
            const resultsReload = await get(promotedCredentials);
            assert.equal(resultsReload.body.room.phase, 'match-results');
            assert.equal(resultsReload.body.room.matchId, matchId);
            const rematch = await post({ action: 'rematch', credentials: promotedCredentials });
            assert.equal(rematch.body.room.phase, 'lobby');
            assert.notEqual(rematch.body.room.matchId, matchId);
            assert.ok(!rematch.body.room.players.some((player) => player.id === host.playerId), 'departed host should not ghost the rematch lobby');

            const storedKey = `make-a-word:room:${host.code}`;
            const stored = redis.peek(storedKey);
            now = stored.createdAt + 5 * 60 * 60 * 1_000;
            assert.equal((await post({ action: 'heartbeat', credentials: promotedCredentials })).body.ok, true);
            assert.equal(redis.expiresAt(storedKey), stored.createdAt + 6 * 60 * 60 * 1_000, 'heartbeat must not extend room lifetime');
            now = stored.createdAt + 6 * 60 * 60 * 1_000 + 1;
            assert.equal((await get(promotedCredentials)).body.ok, false, 'expired room must not reconnect');

            now = 1_900_000_000_000;
            const created2 = await post({ action: 'create', name: 'Host 2', settings: { rounds: 1, roundSeconds: 60, maxPlayers: 4 } });
            const host2 = created2.body.credentials;
            const joined2 = await post({ action: 'join', code: host2.code, name: 'Guest 2' });
            const guest2 = joined2.body.credentials;
            await post({ action: 'ready', credentials: guest2, ready: true });
            const started2 = await post({ action: 'start', credentials: host2 });
            const baseline = started2.body.room.serverNow;
            now = baseline + 15_000;
            await post({ action: 'heartbeat', credentials: guest2 });
            now = baseline + 29_000;
            const migrated = await post({ action: 'heartbeat', credentials: guest2 });
            assert.equal(migrated.body.room.players.find((player) => player.id === guest2.playerId)?.isHost, true, 'stale host should migrate within the bounded failover window');
            assert.equal((await get(guest2)).body.ok, true, 'promoted host should reconnect after reload');

            const main = fs.readFileSync(new URL('../src/main.ts', import.meta.url), 'utf8');
            assert.ok(main.includes('Connection interrupted. Reconnecting…'));
            assert.ok(main.includes('ROOM_EXPIRED'));
            console.log('Online torture passed: burst submits, duplicate races, host failover, reconnect/results/rematch, stale-player pruning, and absolute expiry are stable.');
          } finally {
            Date.now = originalNow;
            __setRedisClientForTests(null);
          }
          EOF
      - name: Verify torture pass
        run: |
          npm ci
          npm run online:verify
          npm run build
      - name: Commit online torture pass
        run: |
          git config user.name "Make a Word CI"
          git config user.email "actions@users.noreply.github.com"
          git add api/room.ts src/main.ts scripts/verify-online-hardening.mjs scripts/verify-online-torture.mjs package.json
          git commit -m "Harden online recovery and add failure torture tests"
          git push origin HEAD:fix/online-failure-torture
