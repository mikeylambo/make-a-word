name: Apply save and reload torture pass

on:
  push:
    branches: [fix/save-reload-torture]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/save-reload-torture
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add resumable solo run store
        run: |
          cat > src/run-store.ts <<'EOF'
          export type RunMode = "classic" | "burn" | "blitz" | "daily" | "journey";

          export type RunSnapshot = {
            version: 1;
            savedAt: number;
            mode: RunMode;
            phraseId: string;
            score: number;
            duration: number;
            timeLeft: number;
            submitted: string[];
            found: Array<{ word: string; points: number; rarity?: 1 | 1.3 | 1.6 }>;
            burned: number[];
            usedLetters: string[];
            combo: number;
            chainBank: number;
            chainLength: number;
            bestCombo: number;
            comboAgeMs: number;
            startedElapsedMs: number;
            boardNumber: number;
            boardsCleared: number;
            boardWords: number;
            boardCandidates: string[];
            journeyStage?: number;
            challengeTarget?: number;
            dailyKey?: string;
            paused: boolean;
            newBest: boolean;
            firstWordTracked: boolean;
          };

          type StorageLike = Pick<Storage, "getItem" | "setItem" | "removeItem">;

          const MEMORY_RUNS = new Map<string, RunSnapshot>();
          const MAX_AGE_MS = 30 * 60 * 1000;
          const VALID_DURATIONS = new Set([60, 120, 150, 180]);
          const VALID_MODES = new Set<RunMode>(["classic", "burn", "blitz", "daily", "journey"]);

          function safeInt(value: unknown, min = 0, max = Number.MAX_SAFE_INTEGER, fallback = min): number {
            return typeof value === "number" && Number.isFinite(value)
              ? Math.min(max, Math.max(min, Math.floor(value)))
              : fallback;
          }

          function safeWord(value: unknown): string | null {
            if (typeof value !== "string") return null;
            const word = value.toLowerCase().replace(/[^a-z]/g, "").slice(0, 24);
            return word.length >= 3 ? word : null;
          }

          function safeWords(value: unknown, limit = 1200): string[] {
            if (!Array.isArray(value)) return [];
            const words = value.map(safeWord).filter((word): word is string => Boolean(word));
            return [...new Set(words)].slice(0, limit);
          }

          function optionalInt(value: unknown, min: number, max: number): number | undefined {
            return typeof value === "number" && Number.isFinite(value)
              ? Math.min(max, Math.max(min, Math.floor(value)))
              : undefined;
          }

          export function sanitizeRunSnapshot(value: unknown): RunSnapshot | null {
            if (!value || typeof value !== "object" || Array.isArray(value)) return null;
            const input = value as Partial<RunSnapshot>;
            if (input.version !== 1 || !VALID_MODES.has(input.mode as RunMode)) return null;
            if (typeof input.phraseId !== "string" || !/^[a-z0-9._:-]{1,80}$/i.test(input.phraseId)) return null;
            if (typeof input.savedAt !== "number" || !Number.isFinite(input.savedAt)) return null;
            const duration = VALID_DURATIONS.has(Number(input.duration)) ? Number(input.duration) : 120;
            const found = Array.isArray(input.found)
              ? input.found.slice(0, 500).flatMap((entry) => {
                  if (!entry || typeof entry !== "object") return [];
                  const item = entry as { word?: unknown; points?: unknown; rarity?: unknown };
                  const word = safeWord(item.word);
                  if (!word) return [];
                  const rarity = item.rarity === 1.3 || item.rarity === 1.6 ? item.rarity : 1;
                  return [{ word, points: safeInt(item.points, 0, 10_000_000), rarity }];
                })
              : [];
            const burned = Array.isArray(input.burned)
              ? [...new Set(input.burned.map((entry) => safeInt(entry, 0, 512, -1)).filter((entry) => entry >= 0))].slice(0, 512)
              : [];
            const usedLetters = Array.isArray(input.usedLetters)
              ? [...new Set(input.usedLetters.filter((entry): entry is string => typeof entry === "string" && /^[a-z]$/i.test(entry)).map((entry) => entry.toLowerCase()))].slice(0, 26)
              : [];
            const dailyKey = typeof input.dailyKey === "string" && /^\d{4}-\d{2}-\d{2}$/.test(input.dailyKey) ? input.dailyKey : undefined;
            return {
              version: 1,
              savedAt: Math.floor(input.savedAt),
              mode: input.mode as RunMode,
              phraseId: input.phraseId,
              score: safeInt(input.score, 0, 100_000_000),
              duration,
              timeLeft: safeInt(input.timeLeft, 0, duration, duration),
              submitted: safeWords(input.submitted, 500),
              found,
              burned,
              usedLetters,
              combo: safeInt(input.combo, 0, 999),
              chainBank: safeInt(input.chainBank, 0, 100_000_000),
              chainLength: safeInt(input.chainLength, 0, 999),
              bestCombo: safeInt(input.bestCombo, 0, 999),
              comboAgeMs: safeInt(input.comboAgeMs, 0, 300_000),
              startedElapsedMs: safeInt(input.startedElapsedMs, 0, 3_600_000),
              boardNumber: safeInt(input.boardNumber, 1, 10_000, 1),
              boardsCleared: safeInt(input.boardsCleared, 0, 10_000),
              boardWords: safeInt(input.boardWords, 0, 10_000),
              boardCandidates: safeWords(input.boardCandidates),
              journeyStage: optionalInt(input.journeyStage, 0, 10_000),
              challengeTarget: optionalInt(input.challengeTarget, 0, 10_000_000),
              dailyKey,
              paused: input.paused === true,
              newBest: input.newBest === true,
              firstWordTracked: input.firstWordTracked === true
            };
          }

          export function resumedTimeLeft(snapshot: RunSnapshot, now = Date.now()): number {
            if (snapshot.paused) return snapshot.timeLeft;
            const elapsed = Math.max(0, Math.floor((now - snapshot.savedAt) / 1000));
            return Math.max(0, snapshot.timeLeft - elapsed);
          }

          export function resumeGapMs(snapshot: RunSnapshot, now = Date.now()): number {
            return snapshot.paused ? 0 : Math.max(0, now - snapshot.savedAt);
          }

          export class RunStore {
            constructor(private readonly key = "slu.make-a-word.run.v1", private readonly storage?: StorageLike) {}

            private getStorage(): StorageLike {
              if (this.storage) return this.storage;
              return localStorage;
            }

            load(now = Date.now()): RunSnapshot | null {
              let candidate = MEMORY_RUNS.get(this.key) ?? null;
              try {
                const raw = this.getStorage().getItem(this.key);
                if (raw) candidate = sanitizeRunSnapshot(JSON.parse(raw));
              } catch {
                // Memory fallback below keeps restricted storage non-fatal.
              }
              const safe = sanitizeRunSnapshot(candidate);
              if (!safe || safe.savedAt > now + 5 * 60 * 1000 || now - safe.savedAt > MAX_AGE_MS) {
                this.clear();
                return null;
              }
              MEMORY_RUNS.set(this.key, safe);
              return structuredClone(safe);
            }

            save(snapshot: RunSnapshot): void {
              const safe = sanitizeRunSnapshot(snapshot);
              if (!safe) return;
              MEMORY_RUNS.set(this.key, safe);
              try {
                this.getStorage().setItem(this.key, JSON.stringify(safe));
              } catch {
                // Reload recovery cannot be guaranteed when storage is blocked,
                // but the active tab remains safe and playable.
              }
            }

            clear(): void {
              MEMORY_RUNS.delete(this.key);
              try {
                this.getStorage().removeItem(this.key);
              } catch {
                // Restricted storage is already equivalent to no persisted run.
              }
            }
          }
          EOF
      - name: Patch permanent save and game lifecycle
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return source.replace(old, new, 1)

          shell_path = Path('src/shell.ts')
          shell = shell_path.read_text()
          old = '''  save(data: SaveData): void {\n    let previous = MEMORY_SAVES.get(this.key);\n    if (!previous) {\n      try {\n        const raw = localStorage.getItem(this.key);\n        if (raw) previous = sanitizeSave(JSON.parse(raw));\n      } catch {\n        // Fall through to the default snapshot below.\n      }\n    }'''
          new = '''  save(data: SaveData): void {\n    let previous = MEMORY_SAVES.get(this.key);\n    try {\n      // Always re-read the persisted snapshot before merging. Separate tabs have\n      // separate module memory, so memory-first writes can otherwise overwrite\n      // legitimate progress or settings produced by another live tab.\n      const raw = localStorage.getItem(this.key);\n      if (raw) previous = sanitizeSave(JSON.parse(raw));\n    } catch {\n      // Fall through to the in-memory snapshot when storage is unavailable.\n    }'''
          shell = replace_once(shell, old, new, 'cross-tab save reconciliation')
          shell_path.write_text(shell)

          main_path = Path('src/main.ts')
          main = main_path.read_text()
          main = replace_once(main,
            'import { SaveStore, ScreenManager, MenuNavigator, TinyAudio, type SaveData, type ScreenId } from "./shell";',
            'import { SaveStore, ScreenManager, MenuNavigator, TinyAudio, type SaveData, type ScreenId } from "./shell";\nimport { RunStore, resumeGapMs, resumedTimeLeft, type RunSnapshot } from "./run-store";',
            'run store import')
          main = replace_once(main,
            'const store = new SaveStore();\nlet save: SaveData = store.load();',
            'const store = new SaveStore();\nconst runStore = new RunStore();\nlet save: SaveData = store.load();',
            'run store instance')

          marker = '''function togetherTurnDuration(mode: TogetherMode): number {\n  if (mode === "relay") return 60;\n  if (mode === "pass-play") return 30;\n  return 12;\n}\n'''
          insertion = marker + '''\nfunction persistRoundSnapshot(): void {\n  const state = round;\n  if (!state || state.ended || state.starting || state.dealing) return;\n  const now = performance.now();\n  const capturedAt = state.paused && state.comboFrozenAt ? state.comboFrozenAt : now;\n  const comboAgeMs = state.lastValidAt ? Math.max(0, capturedAt - state.lastValidAt) : 0;\n  const startedElapsedMs = state.startedAt ? Math.max(0, capturedAt - state.startedAt) : 0;\n  runStore.save({\n    version: 1,\n    savedAt: Date.now(),\n    mode: state.mode,\n    phraseId: state.phrase.id,\n    score: state.score,\n    duration: state.duration,\n    timeLeft: state.timeLeft,\n    submitted: [...state.submitted],\n    found: state.found.map((entry) => ({ ...entry })),\n    burned: [...state.burned],\n    usedLetters: [...state.usedLetters],\n    combo: state.combo,\n    chainBank: state.chainBank,\n    chainLength: state.chainLength,\n    bestCombo: state.bestCombo,\n    comboAgeMs,\n    startedElapsedMs,\n    boardNumber: state.boardNumber,\n    boardsCleared: state.boardsCleared,\n    boardWords: state.boardWords,\n    boardCandidates: [...state.boardCandidates],\n    journeyStage: state.journeyStage,\n    challengeTarget: state.challengeTarget,\n    dailyKey: state.dailyKey,\n    paused: state.paused,\n    newBest: state.newBest,\n    firstWordTracked: state.firstWordTracked\n  });\n}\n\nfunction restoreRoundSnapshot(snapshot: RunSnapshot): boolean {\n  const phrase = PHRASES.find((entry) => entry.id === snapshot.phraseId)\n    ?? JOURNEY_PHRASES.find((entry) => entry.id === snapshot.phraseId);\n  if (!phrase) {\n    runStore.clear();\n    return false;\n  }\n  stopTimer();\n  stopTogetherTimer();\n  flowToken += 1;\n  const gapMs = resumeGapMs(snapshot);\n  const remaining = resumedTimeLeft(snapshot);\n  const now = performance.now();\n  round = {\n    mode: snapshot.mode,\n    phrase,\n    score: snapshot.score,\n    duration: snapshot.duration,\n    timeLeft: remaining,\n    submitted: new Set(snapshot.submitted),\n    found: snapshot.found.map((entry) => ({ ...entry })),\n    burned: new Set(snapshot.burned),\n    usedLetters: new Set(snapshot.usedLetters),\n    combo: snapshot.combo,\n    chainBank: snapshot.chainBank,\n    chainLength: snapshot.chainLength,\n    bestCombo: snapshot.bestCombo,\n    lastValidAt: snapshot.comboAgeMs ? now - snapshot.comboAgeMs - gapMs : 0,\n    comboFrozenAt: snapshot.paused && snapshot.comboAgeMs ? now : 0,\n    boardNumber: snapshot.boardNumber,\n    boardsCleared: snapshot.boardsCleared,\n    boardWords: snapshot.boardWords,\n    boardCandidates: [...snapshot.boardCandidates],\n    journeyStage: snapshot.journeyStage,\n    challengeTarget: snapshot.challengeTarget,\n    dailyKey: snapshot.dailyKey,\n    starting: false,\n    dealing: false,\n    paused: snapshot.paused,\n    ended: false,\n    newBest: snapshot.newBest,\n    startedAt: snapshot.startedElapsedMs ? now - snapshot.startedElapsedMs - gapMs : now,\n    firstWordTracked: snapshot.firstWordTracked\n  };\n  lastPhraseText = phrase.text;\n  renderGame();\n  if (remaining <= 0) {\n    endRound();\n    return true;\n  }\n  if (snapshot.paused) {\n    togglePause(true);\n  } else {\n    setGameControlsDisabled(false);\n    focusWordInput();\n    timerId = window.setInterval(tick, 1000);\n  }\n  return true;\n}\n'''
          main = replace_once(main, marker, insertion, 'snapshot helpers')

          main = replace_once(main,
            'function showMenu(): void {\n  stopTimer();\n  stopTogetherTimer();\n  stopOnlineSync();',
            'function showMenu(): void {\n  stopTimer();\n  stopTogetherTimer();\n  stopOnlineSync();\n  runStore.clear();',
            'clear abandoned run at menu')
          main = replace_once(main,
            'function startRound(mode: ModeId, phraseOverride?: PhraseEntry, journeyStage?: number, challengeTarget?: number, durationOverride?: number): void {\n  stopTimer();\n  stopTogetherTimer();',
            'function startRound(mode: ModeId, phraseOverride?: PhraseEntry, journeyStage?: number, challengeTarget?: number, durationOverride?: number): void {\n  stopTimer();\n  stopTogetherTimer();\n  runStore.clear();',
            'replace old run on start')
          main = replace_once(main,
            '  round.starting = false;\n  round.startedAt = performance.now();\n  setGameControlsDisabled(false);',
            '  round.starting = false;\n  round.startedAt = performance.now();\n  persistRoundSnapshot();\n  setGameControlsDisabled(false);',
            'snapshot after countdown')
          main = replace_once(main,
            '  round.timeLeft -= 1;\n  const time = document.querySelector<HTMLElement>("#time-value");',
            '  round.timeLeft -= 1;\n  persistRoundSnapshot();\n  const time = document.querySelector<HTMLElement>("#time-value");',
            'snapshot each active tick')
          main = replace_once(main,
            '  round.boardWords += 1;\n  if (round.mode === "burn") round.burned = burnLetters(round.phrase.text, result.word, round.burned);',
            '  round.boardWords += 1;\n  if (round.mode === "burn") round.burned = burnLetters(round.phrase.text, result.word, round.burned);\n  persistRoundSnapshot();',
            'snapshot accepted word')
          main = replace_once(main,
            '  clearComboMeter();\n  updateGameHud(previousScore);\n  if (announce) {',
            '  clearComboMeter();\n  updateGameHud(previousScore);\n  persistRoundSnapshot();\n  if (announce) {',
            'snapshot chain cashout')
          main = replace_once(main,
            '  round.paused = willPause;\n  const layer = document.querySelector<HTMLElement>("#pause-layer");',
            '  round.paused = willPause;\n  persistRoundSnapshot();\n  const layer = document.querySelector<HTMLElement>("#pause-layer");',
            'snapshot pause transition')
          main = replace_once(main,
            '  store.save(save);\n  showResults();',
            '  store.save(save);\n  runStore.clear();\n  showResults();',
            'clear completed run snapshot')
          main = replace_once(main,
            '});\n\ndocument.documentElement.classList.toggle("reduce-motion", save.settings.reducedMotion);\nconst initialQuery',
            '});\n\nwindow.addEventListener("pagehide", () => {\n  if (round && !round.ended && !round.paused) persistRoundSnapshot();\n});\n\ndocument.documentElement.classList.toggle("reduce-motion", save.settings.reducedMotion);\nconst initialQuery',
            'pagehide snapshot')
          main = replace_once(main,
            'if (initialRoomCode.length === 6) void resumeOnlineRoom(initialRoomCode);\nelse if (pendingChallenge) showChallengeLanding();\nelse showTitle();',
            'if (initialRoomCode.length === 6) void resumeOnlineRoom(initialRoomCode);\nelse if (pendingChallenge) showChallengeLanding();\nelse {\n  const resumableRound = runStore.load();\n  if (!resumableRound || !restoreRoundSnapshot(resumableRound)) showTitle();\n}',
            'restore on normal boot')
          main_path.write_text(main)

          package_path = Path('package.json')
          package = package_path.read_text()
          package = replace_once(package,
            '"save:runtime": "node scripts/verify-save-runtime.mjs",',
            '"save:runtime": "node scripts/verify-save-runtime.mjs && node scripts/verify-run-store.mjs",',
            'run store verification hook')
          package_path.write_text(package)
          PY
      - name: Expand save and reload runtime tests
        run: |
          cat >> scripts/verify-save-runtime.mjs <<'EOF'

          async function isolatedSaveStore(tag) {
            const isolatedCompiled = ts.transpileModule(`${shellSource}\n// isolated:${tag}`, {
              compilerOptions: { target: ts.ScriptTarget.ES2022, module: ts.ModuleKind.ES2022 }
            }).outputText;
            const url = `data:text/javascript;base64,${Buffer.from(isolatedCompiled).toString('base64')}`;
            return (await import(url)).SaveStore;
          }

          data.delete('test.real-tabs');
          const TabAStore = await isolatedSaveStore('a');
          const TabBStore = await isolatedSaveStore('b');
          const tabA = new TabAStore('test.real-tabs');
          const tabB = new TabBStore('test.real-tabs');
          const tabASave = tabA.load();
          const tabBSave = tabB.load();
          tabASave.totalWords += 4;
          tabASave.totalScore += 900;
          tabA.save(tabASave);
          tabBSave.totalWords += 6;
          tabBSave.totalScore += 1100;
          tabB.save(tabBSave);
          const tabResult = JSON.parse(data.get('test.real-tabs'));
          assert.equal(tabResult.totalWords, 10, 'separate tabs must add stale word deltas instead of overwriting');
          assert.equal(tabResult.totalScore, 2000, 'separate tabs must add stale score deltas instead of overwriting');

          data.set('test.legacy', JSON.stringify({ bestScores: { blitz: 4321 }, totalWords: 11, settings: { sound: false } }));
          const legacy = new SaveStore('test.legacy').load();
          assert.equal(legacy.bestScores['classic:60'], 4321, 'legacy Blitz score must migrate into 60-second Classic');
          assert.equal(legacy.totalWords, 11);
          assert.equal(legacy.settings.sound, false);
          assert.equal(legacy.journeyUnlocked, 1, 'missing newer save fields must receive safe defaults');

          console.log('Extended save runtime passed: legacy saves migrate and genuinely separate tab modules reconcile their stale deltas.');
          EOF

          cat > scripts/verify-run-store.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import ts from 'typescript';

          const source = fs.readFileSync(new URL('../src/run-store.ts', import.meta.url), 'utf8');
          const compiled = ts.transpileModule(source, { compilerOptions: { target: ts.ScriptTarget.ES2022, module: ts.ModuleKind.ES2022 } }).outputText;
          const moduleUrl = `data:text/javascript;base64,${Buffer.from(compiled).toString('base64')}`;
          const { RunStore, sanitizeRunSnapshot, resumedTimeLeft, resumeGapMs } = await import(moduleUrl);

          class MemoryStorage {
            constructor() { this.data = new Map(); }
            getItem(key) { return this.data.has(key) ? this.data.get(key) : null; }
            setItem(key, value) { this.data.set(key, String(value)); }
            removeItem(key) { this.data.delete(key); }
          }

          const storage = new MemoryStorage();
          const store = new RunStore('run.test', storage);
          const base = {
            version: 1, savedAt: 1_000_000, mode: 'burn', phraseId: 'test-phrase', score: 1200,
            duration: 150, timeLeft: 90, submitted: ['stone', 'tone'],
            found: [{ word: 'stone', points: 500, rarity: 1.3 }], burned: [1, 3, 4],
            usedLetters: ['s', 't', 'o', 'n', 'e'], combo: 2, chainBank: 700, chainLength: 3,
            bestCombo: 4, comboAgeMs: 1200, startedElapsedMs: 22000, boardNumber: 2,
            boardsCleared: 1, boardWords: 2, boardCandidates: ['stone', 'tone', 'one'],
            paused: false, newBest: false, firstWordTracked: true
          };

          store.save(base);
          const restored = store.load(1_005_400);
          assert.equal(restored?.score, 1200);
          assert.equal(restored?.boardNumber, 2);
          assert.deepEqual(restored?.burned, [1, 3, 4]);
          assert.equal(resumedTimeLeft(restored, 1_005_400), 85, 'active reload must consume wall-clock time');
          assert.equal(resumeGapMs(restored, 1_005_400), 5400);

          const paused = { ...base, savedAt: 2_000_000, paused: true, timeLeft: 44 };
          store.save(paused);
          const pausedLoaded = store.load(2_300_000);
          assert.equal(resumedTimeLeft(pausedLoaded, 2_300_000), 44, 'a deliberately paused run must remain paused across reload');
          assert.equal(resumeGapMs(pausedLoaded, 2_300_000), 0);

          storage.setItem('run.corrupt', '{not json');
          assert.equal(new RunStore('run.corrupt', storage).load(), null, 'corrupt run snapshots must be discarded');
          storage.setItem('run.tampered', JSON.stringify({ ...base, version: 99, score: 999999999999 }));
          assert.equal(new RunStore('run.tampered', storage).load(1_000_001), null, 'unknown snapshot versions must not be restored');

          const sanitized = sanitizeRunSnapshot({ ...base, score: -10, timeLeft: 999, burned: [-2, 3, 9000], usedLetters: ['A', '!', 'b'] });
          assert.equal(sanitized.score, 0);
          assert.equal(sanitized.timeLeft, 150);
          assert.deepEqual(sanitized.burned, [3, 512]);
          assert.deepEqual(sanitized.usedLetters, ['a', 'b']);

          store.save({ ...base, savedAt: 3_000_000 });
          assert.equal(store.load(3_000_000 + 31 * 60 * 1000), null, 'abandoned runs must expire instead of resurfacing later');

          const blocked = { getItem() { throw new Error('blocked'); }, setItem() { throw new Error('blocked'); }, removeItem() { throw new Error('blocked'); } };
          const blockedStore = new RunStore('run.blocked', blocked);
          assert.doesNotThrow(() => blockedStore.save({ ...base, savedAt: Date.now() }));
          assert.equal(blockedStore.load()?.score, 1200, 'blocked storage must remain non-fatal in the active tab');

          const main = fs.readFileSync(new URL('../src/main.ts', import.meta.url), 'utf8');
          for (const token of [
            'function persistRoundSnapshot(): void',
            'function restoreRoundSnapshot(snapshot: RunSnapshot): boolean',
            'persistRoundSnapshot();\n  const time =',
            'runStore.clear();\n  showResults();',
            'window.addEventListener("pagehide"',
            'const resumableRound = runStore.load();'
          ]) assert.ok(main.includes(token), `main lifecycle is missing reload invariant: ${token}`);

          console.log('Run-store torture passed: Burn/Daily/Trials-compatible round state survives reload, active time cannot be frozen by refresh, paused runs stay paused, bad/old snapshots are rejected, and abandoned runs expire.');
          EOF
      - name: Verify full release gate
        run: |
          npm ci
          npm run verify
      - name: Commit verified save and reload pass
        run: |
          git config user.name "Make a Word CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-save-reload-torture.yml
          git add src/run-store.ts src/shell.ts src/main.ts scripts/verify-save-runtime.mjs scripts/verify-run-store.mjs package.json
          git commit -m "Harden save and reload recovery"
          git push origin HEAD:fix/save-reload-torture
